name: Android APK release

on:
  push:
    tags:
      - "redesign-android-v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install web dependencies
        run: npm ci

      - name: Build and sync Android project
        run: npm run mobile:sync

      - name: Build installable APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Prepare release files
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-output/islamona-android-v1.2.2.apk"
          sha256sum "release-output/islamona-android-v1.2.2.apk" > "release-output/islamona-android-v1.2.2.apk.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-output/islamona-android-v1.2.2.apk \
            release-output/islamona-android-v1.2.2.apk.sha256 \
            --title "إسلامنا Android 1.2.2" \
            --notes "نسخة Android قابلة للتثبيت مباشرة. تتضمن البحث المؤجل في التفسير والحديث وتحسين صفحة قراءة القرآن. الحد الأدنى Android 7.0."
