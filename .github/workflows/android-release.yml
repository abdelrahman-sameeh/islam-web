name: Android APK release

on:
  push:
    tags:
      - "redesign-android-v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK 36
        run: |
          sdk_manager_path="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdk_manager_path" "platforms;android-36" "build-tools;36.0.0"

      - name: Install web dependencies
        run: npm ci

      - name: Build and sync Android project
        run: npm run mobile:sync

      - name: Build installable APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Prepare release files
        run: |
          release_version="${GITHUB_REF_NAME#redesign-android-v}"
          artifact_name="daqaeq-noor-android-v${release_version}.apk"
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-output/$artifact_name"
          (cd release-output && sha256sum "$artifact_name" > "$artifact_name.sha256")
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"
          echo "APK_PATH=release-output/$artifact_name" >> "$GITHUB_ENV"
          echo "CHECKSUM_PATH=release-output/$artifact_name.sha256" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$APK_PATH" \
            "$CHECKSUM_PATH" \
            --title "دقائق نور Android $RELEASE_VERSION" \
            --notes "نسخة Android قابلة للتثبيت مباشرة. أصلحنا تغيير السورة داخل التطبيق، وأزلنا شريط مستوى الصوت من المشغل للاعتماد على تحكم النظام، وأضفنا وصولًا واضحًا إلى صفحة التلاوات المحفوظة من داخل المشغل. أصبحت قائمة التنقل تُغلق عند الضغط خارجها أو استخدام Escape. التشغيل بث مباشر والحفظ يتم فقط باختيار المستخدم. الحد الأدنى Android 7.0."
