  <defs><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#123B35" flood-opacity=".08"/></filter><style>.ui{font-family:Cairo,Arial,sans-serif;fill:#17211F}.muted{fill:#6F7874}.label{font-size:14px;font-weight:600}.body{font-size:16px}.title{font-size:30px;font-weight:700}.white{fill:#fff}</style></defs>
