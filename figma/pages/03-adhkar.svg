  <g id="DhikrCards">
    <g filter="url(#s)"><rect x="120" y="404" width="1200" height="194" rx="18" fill="#fff"/><rect x="1240" y="428" width="48" height="48" rx="14" fill="#DCEBE5"/><text x="1264" y="458" text-anchor="middle" class="ui" font-size="18" font-weight="700" fill="#1F6F5B">١</text><text x="1208" y="457" text-anchor="end" class="ui" font-size="20" font-weight="700">ذكر الاستيقاظ والصباح</text><text x="1208" y="505" text-anchor="end" class="ui body">أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ.</text><text x="1208" y="541" text-anchor="end" class="ui label muted">المصدر: حصن المسلم</text><rect x="164" y="532" width="150" height="44" rx="22" fill="#123B35"/><text x="239" y="560" text-anchor="middle" class="ui white label">تبقّى ١ مرة</text><circle cx="340" cy="554" r="22" fill="#FCFAF5" stroke="#E8E1D5"/><path d="M332 554h16" stroke="#3D4743" stroke-width="2"/></g>
    <g filter="url(#s)"><rect x="120" y="622" width="1200" height="222" rx="18" fill="#fff"/><rect x="1240" y="646" width="48" height="48" rx="14" fill="#F1E6D3"/><text x="1264" y="676" text-anchor="middle" class="ui" font-size="18" font-weight="700" fill="#A97A35">٢</text><text x="1208" y="675" text-anchor="end" class="ui" font-size="20" font-weight="700">سيد الاستغفار</text><text x="1208" y="725" text-anchor="end" class="ui body">اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ</text><text x="1208" y="758" text-anchor="end" class="ui body">مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي...</text><text x="1208" y="803" text-anchor="end" class="ui label muted">المصدر: صحيح البخاري</text><rect x="164" y="792" width="150" height="44" rx="22" fill="#1F6F5B"/><text x="239" y="820" text-anchor="middle" class="ui white label">تبقّى ١ مرة</text></g>
    <g opacity=".58"><rect x="120" y="868" width="1200" height="94" rx="18" fill="#fff" stroke="#E8E1D5"/><text x="1280" y="910" text-anchor="end" class="ui" font-size="19" font-weight="700">رضيت بالله ربًا وبالإسلام دينًا</text><text x="1280" y="938" text-anchor="end" class="ui label muted">٣ مرات</text></g>
