    <g filter="url(#s)"><rect x="120" y="416" width="1200" height="204" rx="18" fill="#fff"/><rect x="1240" y="442" width="48" height="48" rx="14" fill="#DCEBE5"/><path d="M1253 454h22v24h-22zM1257 450h14" fill="none" stroke="#1F6F5B" stroke-width="2"/><text x="1208" y="466" text-anchor="end" class="ui" font-size="21" font-weight="700">إنما الأعمال بالنيات</text><text x="1208" y="512" text-anchor="end" class="ui body">عن عمر بن الخطاب رضي الله عنه قال: سمعت رسول الله ﷺ يقول: إنما الأعمال بالنيات، وإنما لكل امرئ ما نوى...</text><g class="ui label"><rect x="1090" y="546" width="118" height="30" rx="15" fill="#DCEBE5"/><text x="1149" y="566" text-anchor="middle" fill="#1F6F5B">حديث صحيح</text><text x="1058" y="566" text-anchor="end" class="muted">متفق عليه · رقم ١</text><text x="164" y="566" fill="#1F6F5B">عرض الشرح والفوائد ←</text></g></g>
