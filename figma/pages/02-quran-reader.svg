    <text x="528" y="374" text-anchor="middle" class="quran" font-size="30">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</text>
    <g class="quran" font-size="27" text-anchor="end"><text x="860" y="442">الْحَمْدُ لِلَّهِ الَّذِي أَنْزَلَ عَلَىٰ عَبْدِهِ الْكِتَابَ</text><text x="860" y="498">وَلَمْ يَجْعَلْ لَهُ عِوَجًا ۜ قَيِّمًا لِيُنْذِرَ بَأْسًا شَدِيدًا</text><text x="860" y="554">مِنْ لَدُنْهُ وَيُبَشِّرَ الْمُؤْمِنِينَ الَّذِينَ يَعْمَلُونَ</text><text x="860" y="610">الصَّالِحَاتِ أَنَّ لَهُمْ أَجْرًا حَسَنًا</text></g>
