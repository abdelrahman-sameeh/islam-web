    <rect x="152" y="664" width="752" height="118" rx="14" fill="#DCEBE5"/><text x="872" y="699" text-anchor="end" class="ui label" fill="#1F6F5B">التفسير الميسر · الآية ١</text><text x="872" y="734" text-anchor="end" class="ui body">الثناء على الله بصفاته التي كلّها أوصاف كمال، وبنعمه الظاهرة والباطنة.</text><text x="872" y="762" text-anchor="end" class="ui body">أنزل القرآن على عبده محمد ﷺ ولم يجعل فيه ميلاً عن الحق.</text>
