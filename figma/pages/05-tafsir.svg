  <g id="AppHeader" filter="url(#s)"><rect x="120" y="28" width="1200" height="72" rx="18" fill="#fff" stroke="#E8E1D5"/><rect x="1218" y="42" width="44" height="44" rx="13" fill="#123B35"/><path d="M1230 57q10-9 20 0v16q-10-7-20 0Z" fill="none" stroke="#F1E6D3" stroke-width="2"/><text x="1202" y="73" text-anchor="end" class="ui" font-size="20" font-weight="700">إسلامنا</text><g class="ui label" text-anchor="middle"><text x="1080" y="72">الرئيسية</text><text x="990" y="72">القرآن</text><text x="900" y="72" fill="#1F6F5B">التفسير</text><text x="810" y="72">الأذكار</text><text x="720" y="72">الحديث</text></g><circle cx="182" cy="64" r="22" fill="#DCEBE5"/><path d="M174 64h16M182 56v16" stroke="#1F6F5B" stroke-width="2"/></g>
  <g id="PageHeader"><text x="1320" y="154" text-anchor="end" class="ui title">تفسير القرآن</text><text x="1320" y="184" text-anchor="end" class="ui body muted">الآية والمعنى في مساحة قراءة واضحة.</text><rect x="120" y="140" width="160" height="44" rx="12" fill="#fff" stroke="#E8E1D5"/><text x="200" y="168" text-anchor="middle" class="ui label">مشاركة رابط الآية</text></g>
  <g id="VerseNavigator" filter="url(#s)"><rect x="972" y="218" width="348" height="700" rx="18" fill="#fff"/><text x="1284" y="260" text-anchor="end" class="ui" font-size="20" font-weight="700">اختيار الآية</text><text x="1284" y="296" text-anchor="end" class="ui label muted">السورة</text><rect x="1004" y="310" width="284" height="48" rx="12" fill="#FCFAF5" stroke="#E8E1D5"/><text x="1260" y="340" text-anchor="end" class="ui body">سورة مريم⌄</text><text x="1284" y="394" text-anchor="end" class="ui label muted">رقم الآية</text><rect x="1004" y="408" width="284" height="48" rx="12" fill="#FCFAF5" stroke="#E8E1D5"/><text x="1260" y="438" text-anchor="end" class="ui body">الآية ٥٨⌄</text><line x1="1004" y1="486" x2="1288" y2="486" stroke="#E8E1D5"/><text x="1284" y="522" text-anchor="end" class="ui label muted">انتقل سريعًا</text><g class="ui label" text-anchor="middle"><rect x="1228" y="544" width="60" height="44" rx="12" fill="#DCEBE5"/><text x="1258" y="572" fill="#1F6F5B">٥٨</text><rect x="1156" y="544" width="60" height="44" rx="12" fill="#FCFAF5" stroke="#E8E1D5"/><text x="1186" y="572">٥٩</text><rect x="1084" y="544" width="60" height="44" rx="12" fill="#FCFAF5" stroke="#E8E1D5"/><text x="1114" y="572">٦٠</text><rect x="1012" y="544" width="60" height="44" rx="12" fill="#FCFAF5" stroke="#E8E1D5"/><text x="1042" y="572">٦١</text></g><rect x="1004" y="632" width="284" height="114" rx="14" fill="#123B35"/><text x="1260" y="668" text-anchor="end" class="ui white label">مصدر التفسير</text><text x="1260" y="700" text-anchor="end" class="ui white" font-size="18" font-weight="700">التفسير الميسر</text><text x="1260" y="728" text-anchor="end" class="ui white" font-size="13" opacity=".7">مجمع الملك فهد</text><text x="1284" y="804" text-anchor="end" class="ui label muted">تفسير آخر</text><rect x="1004" y="818" width="284" height="48" rx="12" fill="#FCFAF5" stroke="#E8E1D5"/><text x="1260" y="848" text-anchor="end" class="ui body">اختر المصدر⌄</text></g>
  <g id="TafsirContent" filter="url(#s)"><rect x="120" y="218" width="828" height="700" rx="18" fill="#fff"/><g id="Verse"><rect x="152" y="250" width="764" height="202" rx="16" fill="#FCFAF5" stroke="#E8E1D5"/><text x="884" y="284" text-anchor="end" class="ui label" fill="#A97A35">سورة مريم · الآية ٥٨</text><text x="884" y="342" text-anchor="end" class="quran" font-size="28">أُولَٰئِكَ الَّذِينَ أَنْعَمَ اللَّهُ عَلَيْهِم مِّنَ النَّبِيِّينَ</text><text x="884" y="394" text-anchor="end" class="quran" font-size="28">إِذَا تُتْلَىٰ عَلَيْهِمْ آيَاتُ الرَّحْمَٰنِ خَرُّوا سُجَّدًا وَبُكِيًّا</text><circle cx="184" cy="282" r="18" fill="#F1E6D3"/><text x="184" y="288" text-anchor="middle" class="ui label" fill="#A97A35">٥٨</text></g>
    <g id="Explanation"><text x="884" y="506" text-anchor="end" class="ui" font-size="21" font-weight="700">التفسير</text><line x1="152" y1="526" x2="916" y2="526" stroke="#E8E1D5"/><text x="884" y="570" text-anchor="end" class="ui" font-size="18">هؤلاء المذكورون في هذه السورة هم الذين أنعم الله عليهم بالنبوة والهداية،</text><text x="884" y="608" text-anchor="end" class="ui" font-size="18">من ذرية آدم، وممّن حملنا مع نوح، ومن ذرية إبراهيم وإسرائيل، وممّن هدينا</text><text x="884" y="646" text-anchor="end" class="ui" font-size="18">واخترنا. إذا تُقرأ عليهم آيات الرحمن المتضمنة توحيده وحججه خرّوا ساجدين</text><text x="884" y="684" text-anchor="end" class="ui" font-size="18">لله خضوعًا واستكانة، وبكوا من خشيته سبحانه.</text><rect x="152" y="730" width="764" height="90" rx="14" fill="#DCEBE5"/><text x="884" y="764" text-anchor="end" class="ui label" fill="#1F6F5B">تنبيه المصدر</text><text x="884" y="794" text-anchor="end" class="ui body">النص كما ورد من المصدر، ويُعرض دون تعديل أو اختصار.</text><g class="ui label"><text x="884" y="870" text-anchor="end" fill="#1F6F5B">الآية التالية ←</text><text x="152" y="870" fill="#1F6F5B">→ الآية السابقة</text></g></g></g>
  <text x="720" y="974" text-anchor="middle" class="ui label muted">Desktop · 1440 · Tafsir</text>
</svg>
